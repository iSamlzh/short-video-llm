limit_req_zone $binary_remote_addr zone=content_agent_login:10m rate=10r/m;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $status $content_agent_normal_request {
    ~^5 0;
    default 1;
}

map $status $content_agent_exception_request {
    ~^5 1;
    default 0;
}

log_format content_agent_json escape=json
    '{"timestamp":"$time_iso8601","requestId":"$request_id","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
    '"upstreamDurationSeconds":"$upstream_response_time","upstreamStatus":"$upstream_status"}';

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;

    client_max_body_size 10m;
    access_log /var/log/content-agent/nginx-access.jsonl content_agent_json if=$content_agent_normal_request;
    access_log /var/log/content-agent/nginx-exception.jsonl content_agent_json if=$content_agent_exception_request;
    error_log /var/log/content-agent/nginx-error.log warn;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Request-Id $request_id always;
    proxy_hide_header X-Request-Id;
    proxy_set_header X-Request-Id $request_id;

    location = /api/auth/login {
        limit_req zone=content_agent_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }
}
